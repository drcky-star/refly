<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect } from "react";
import { createRoot } from "react-dom/client";
import { motion, AnimatePresence } from "framer-motion";
import {
  Sparkles, ArrowRight, Upload, Play, Check, ShieldCheck, Quote, BookOpen,
  Palette, GraduationCap, Workflow, FileDown, ScanLine, Menu, X, Star,
  FileText, Zap, Link2, ChevronRight
} from "lucide-react";

const APP_URL = "/register";
const LOGIN_URL = "/login";

/* ---------- existing logo (do not modify) ---------- */
function Logo({ size = 34 }) {
  return <img src="/static/refly-icon-128.png" width={size} height={size} alt="Refly"
    style={{ borderRadius: size * 0.26, boxShadow: "0 8px 22px -6px rgba(99,102,241,.55)" }} />;
}

const fade = { hidden: { opacity: 0, y: 22 }, show: { opacity: 1, y: 0, transition: { duration: 0.6, ease: [0.22, 1, 0.36, 1] } } };
const stagger = { hidden: {}, show: { transition: { staggerChildren: 0.09 } } };

/* ---------- NAV ---------- */
const NAV_LINKS = [
  { label: "Product", href: "#product" },
  { label: "How It Works", href: "#how" },
  { label: "Citation Styles", href: "#styles" },
  { label: "Pricing", href: "#pricing" },
];
function Nav() {
  const [open, setOpen] = useState(false);
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const on = () => setScrolled(window.scrollY > 16);
    window.addEventListener("scroll", on); return () => window.removeEventListener("scroll", on);
  }, []);
  return (
    <header className={"fixed top-0 inset-x-0 z-50 transition-all duration-300 " + (scrolled ? "py-2" : "py-4")}>
      <div className="max-w-6xl mx-auto px-4 lg:px-6">
        <div className={"flex items-center gap-3 rounded-2xl px-3.5 h-14 transition-all " + (scrolled ? "glass-strong ring-soft" : "")}>
          <a href={APP_URL} className="flex items-center gap-2.5 pr-2">
            <Logo size={30} />
            <span className="text-white font-extrabold text-[19px] tracking-tight">Refly</span>
          </a>
          <nav className="hidden md:flex items-center gap-1 ml-2">
            {NAV_LINKS.map(l => (
              <a key={l.label} href={l.href} className="px-3 py-2 text-[13.5px] font-medium text-slate-300 hover:text-white rounded-lg hover:bg-white/5 transition">{l.label}</a>
            ))}
          </nav>
          <div className="flex-1" />
          <a href={LOGIN_URL} className="hidden sm:inline-flex px-3.5 py-2 text-[13.5px] font-semibold text-slate-200 hover:text-white transition">Sign In</a>
          <a href={APP_URL} className="hidden sm:inline-flex items-center gap-1.5 h-10 px-4 rounded-xl text-[13.5px] font-semibold text-white bg-gradient-to-r from-indigo-500 to-violet-600 cta-glow transition-all">
            Get Started <ArrowRight size={15} />
          </a>
          <button className="md:hidden ml-1 w-10 h-10 grid place-items-center rounded-xl text-white bg-white/5" onClick={() => setOpen(o => !o)}>
            {open ? <X size={18} /> : <Menu size={18} />}
          </button>
        </div>
        <AnimatePresence>
          {open && (
            <motion.div initial={{ opacity: 0, y: -8 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -8 }}
              className="md:hidden mt-2 glass-strong ring-soft rounded-2xl p-3">
              {NAV_LINKS.map(l => <a key={l.label} href={l.href} onClick={() => setOpen(false)} className="block px-3 py-2.5 text-[14px] font-medium text-slate-200 hover:text-white rounded-lg hover:bg-white/5">{l.label}</a>)}
              <div className="flex gap-2 mt-2">
                <a href={LOGIN_URL} className="flex-1 text-center py-2.5 rounded-xl text-[14px] font-semibold text-slate-200 bg-white/5">Sign In</a>
                <a href={APP_URL} className="flex-1 text-center py-2.5 rounded-xl text-[14px] font-semibold text-white bg-gradient-to-r from-indigo-500 to-violet-600">Get Started</a>
              </div>
            </motion.div>
          )}
        </AnimatePresence>
      </div>
    </header>
  );
}

/* ---------- animated transformation demo (the centerpiece) ---------- */
const CLAIMS = [
  "Chronic low back pain is a leading cause of disability worldwide",
  "supervised exercise therapy reduces pain and improves function",
  "microdiscectomy provides faster short-term relief of sciatica than conservative care",
];
const REFS = [
  { authors: "Hartvigsen J, et al.", title: "What low back pain is and why we need to pay attention.", journal: "Lancet", year: "2018" },
  { authors: "Hayden JA, et al.", title: "Exercise therapy for chronic low back pain.", journal: "Cochrane Database Syst Rev", year: "2021" },
  { authors: "Bailey CS, et al.", title: "Surgery vs. prolonged conservative care for sciatica.", journal: "N Engl J Med", year: "2020" },
];
// phase 0 scan · 1..3 reveal each claim+citation+source · 4 bibliography · 5 hold → loop
function Claim({ i, phase, children }) {
  const active = phase >= i + 1 && phase <= 5;
  return (
    <span className="relative">
      <span className={"rounded px-0.5 transition-colors duration-500 " + (active ? "bg-indigo-400/15 text-white" : "text-slate-500")}>{children}</span>
      <AnimatePresence>
        {active && (
          <motion.sup key="c" initial={{ scale: 0, opacity: 0 }} animate={{ scale: 1, opacity: 1 }}
            transition={{ type: "spring", stiffness: 420, damping: 16 }}
            className="ml-0.5 font-bold text-cyan-300 text-[0.72em] align-super">[{i + 1}]</motion.sup>
        )}
      </AnimatePresence>
    </span>
  );
}
function TransformDemo() {
  const [phase, setPhase] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setPhase(p => (p + 1) % 6), 1450);
    return () => clearInterval(id);
  }, []);
  return (
    <div className="relative">
      <div className="glass-strong ring-soft rounded-3xl p-4 sm:p-5 overflow-hidden">
        {/* window chrome */}
        <div className="flex items-center gap-2 pb-3 mb-1 border-b border-white/5">
          <span className="w-3 h-3 rounded-full bg-rose-400/70" /><span className="w-3 h-3 rounded-full bg-amber-400/70" /><span className="w-3 h-3 rounded-full bg-emerald-400/70" />
          <div className="ml-2 flex items-center gap-1.5 text-[12px] text-slate-400"><FileText size={13} /> thesis-draft.docx</div>
          <div className="flex-1" />
          <div className={"flex items-center gap-1.5 text-[11.5px] font-semibold px-2 py-1 rounded-full transition-colors " + (phase >= 4 ? "text-emerald-300 bg-emerald-400/10" : "text-cyan-300 bg-cyan-400/10")}>
            {phase >= 4 ? <><ShieldCheck size={13} /> Referenced</> : <><ScanLine size={13} /> Analyzing…</>}
          </div>
        </div>
        <div className="grid sm:grid-cols-5 gap-4">
          {/* text panel */}
          <div className="sm:col-span-3 relative">
            <div className="relative rounded-xl bg-navy-950/60 border border-white/5 p-4 overflow-hidden min-h-[212px]">
              {phase <= 1 && <div className="scanline absolute left-3 right-3 h-8 rounded-lg pointer-events-none" style={{ background: "linear-gradient(180deg, rgba(34,211,238,0), rgba(34,211,238,0.16), rgba(34,211,238,0))" }} />}
              <p className="font-serif text-[14.5px] leading-[1.85] text-slate-300 relative">
                <Claim i={0} phase={phase}>{CLAIMS[0]}</Claim>, affecting most adults at some point in life. Robust trials indicate that <Claim i={1} phase={phase}>{CLAIMS[1]}</Claim> compared with usual care. For persistent radicular symptoms, <Claim i={2} phase={phase}>{CLAIMS[2]}</Claim>, although outcomes converge by one year.
              </p>
            </div>
          </div>
          {/* sources / bibliography panel */}
          <div className="sm:col-span-2 flex flex-col gap-2">
            <div className="text-[11px] font-semibold uppercase tracking-widest text-slate-500 mb-0.5">Matched sources</div>
            {REFS.map((r, i) => {
              const shown = phase >= i + 1;
              return (
                <AnimatePresence key={i}>
                  {shown && (
                    <motion.div initial={{ opacity: 0, x: 18, scale: 0.96 }} animate={{ opacity: 1, x: 0, scale: 1 }}
                      transition={{ type: "spring", stiffness: 260, damping: 22 }}
                      className="rounded-xl bg-white/[0.05] border border-white/10 p-2.5 flex gap-2.5">
                      <div className="w-6 h-6 shrink-0 rounded-lg grid place-items-center text-[11px] font-bold text-white bg-gradient-to-br from-indigo-500 to-violet-500">{i + 1}</div>
                      <div className="min-w-0">
                        <div className="text-[11.5px] font-semibold text-slate-100 leading-snug truncate">{r.title}</div>
                        <div className="text-[10.5px] text-slate-400 truncate">{r.authors} · <i>{r.journal}</i> · {r.year}</div>
                      </div>
                      <ShieldCheck size={14} className="ml-auto shrink-0 text-emerald-400" />
                    </motion.div>
                  )}
                </AnimatePresence>
              );
            })}
          </div>
        </div>
        {/* bibliography strip */}
        <AnimatePresence>
          {phase >= 4 && (
            <motion.div initial={{ opacity: 0, height: 0 }} animate={{ opacity: 1, height: "auto" }} exit={{ opacity: 0, height: 0 }}
              className="mt-4 pt-3 border-t border-white/5">
              <div className="text-[11px] font-semibold uppercase tracking-widest text-slate-500 mb-1.5">Bibliography · Vancouver</div>
              <div className="space-y-1">
                {REFS.map((r, i) => (
                  <motion.div key={i} initial={{ opacity: 0, y: 6 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 0.08 * i }}
                    className="text-[11.5px] text-slate-400 leading-snug"><span className="text-slate-200 font-semibold">{i + 1}.</span> {r.authors} {r.title} <i>{r.journal}</i>. {r.year}.</motion.div>
                ))}
              </div>
            </motion.div>
          )}
        </AnimatePresence>
      </div>
      {/* floating verified pill */}
      <motion.div initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 0.6 }}
        className="hidden lg:flex absolute -left-6 -bottom-5 items-center gap-2 glass-strong ring-soft rounded-2xl px-3.5 py-2.5">
        <div className="w-8 h-8 rounded-xl grid place-items-center bg-emerald-400/15 text-emerald-300"><Check size={16} strokeWidth={3} /></div>
        <div><div className="text-[12.5px] font-bold text-white leading-none">Real, verified</div><div className="text-[11px] text-slate-400 mt-0.5">No fabricated citations</div></div>
      </motion.div>
    </div>
  );
}

/* ---------- HERO ---------- */
function Hero() {
  return (
    <section className="relative pt-32 lg:pt-40 pb-20">
      <div className="max-w-6xl mx-auto px-4 lg:px-6 grid lg:grid-cols-2 gap-12 lg:gap-8 items-center">
        <motion.div variants={stagger} initial="hidden" animate="show">
          <motion.a variants={fade} href="#how" className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full glass text-[12.5px] font-medium text-slate-300 mb-6 hover:text-white transition">
            <span className="w-1.5 h-1.5 rounded-full bg-cyan-400" /> AI referencing for academic writing <ChevronRight size={13} />
          </motion.a>
          <motion.h1 variants={fade} className="text-[38px] sm:text-[46px] lg:text-[54px] leading-[1.06] font-extrabold tracking-tight text-white">
            Turn Plain Academic Text Into <span className="grad-text">Referenced Research</span>
          </motion.h1>
          <motion.p variants={fade} className="mt-5 text-[16.5px] leading-relaxed text-slate-300 max-w-xl">
            Paste or upload your academic text. Refly identifies key claims, matches them with relevant scientific sources, adds in-text citations, and creates a formatted bibliography.
          </motion.p>
          <motion.div variants={fade} className="mt-8 flex flex-wrap items-center gap-3">
            <a href={APP_URL} className="inline-flex items-center gap-2 h-12 px-6 rounded-xl text-[15px] font-semibold text-white bg-gradient-to-r from-indigo-500 via-violet-500 to-violet-600 cta-glow transition-all">
              <Sparkles size={18} /> Start Referencing
            </a>
            <a href={APP_URL} className="inline-flex items-center gap-2 h-12 px-6 rounded-xl text-[15px] font-semibold text-white glass hover:bg-white/10 transition">
              <Upload size={17} /> Upload Document
            </a>
            <a href="#how" className="inline-flex items-center gap-2 h-12 px-4 text-[15px] font-semibold text-slate-300 hover:text-white transition">
              <Play size={16} className="text-cyan-400" /> See How It Works
            </a>
          </motion.div>
          <motion.div variants={fade} className="mt-8 flex flex-wrap items-center gap-x-6 gap-y-2 text-[13px] text-slate-400">
            <span className="flex items-center gap-1.5"><ShieldCheck size={15} className="text-emerald-400" /> Verified sources only</span>
            <span className="flex items-center gap-1.5"><Quote size={15} className="text-indigo-400" /> 2,000+ citation styles</span>
            <span className="flex items-center gap-1.5"><GraduationCap size={15} className="text-cyan-400" /> Built for theses & manuscripts</span>
          </motion.div>
        </motion.div>
        <motion.div initial={{ opacity: 0, y: 30, scale: 0.98 }} animate={{ opacity: 1, y: 0, scale: 1 }} transition={{ duration: 0.8, ease: [0.22, 1, 0.36, 1], delay: 0.15 }}>
          <TransformDemo />
        </motion.div>
      </div>
    </section>
  );
}

/* ---------- FEATURES ---------- */
const FEATURES = [
  { icon: Sparkles, title: "AI-Powered Source Matching", desc: "Every claim is matched to real, relevant papers from PubMed, CrossRef and more — never fabricated.", c: "from-indigo-500 to-violet-500" },
  { icon: Quote, title: "Automatic In-Text Citations", desc: "Numbered citations are inserted exactly where each statement needs support.", c: "from-violet-500 to-fuchsia-500" },

];

    <section id="product" className="relative py-20">

/* ---------- HOW IT WORKS ---------- */
const STEPS = [
  { icon: Upload, title: "Paste or Upload Your Text", desc: "Drop in a paragraph, a chapter, or a full Word/PDF draft — with or without references.", tag: "01" },
  { icon: Link2, title: "Match Claims With Sources", desc: "Refly reads each claim, finds genuine scientific papers, and verifies they support it.", tag: "02" },
  { icon: FileDown, title: "Export Your Referenced Document", desc: "Get in-text citations and a formatted bibliography — ready as Word, RIS, BibTeX or EndNote.", tag: "03" },
];
function How() {
  return (
    <section id="how" className="relative py-20">
      <div className="max-w-6xl mx-auto px-4 lg:px-6">
        <motion.div variants={fade} initial="hidden" whileInView="show" viewport={{ once: true, margin: "-80px" }} className="text-center max-w-2xl mx-auto mb-12">
          <div className="text-[13px] font-semibold tracking-widest uppercase text-cyan-300 mb-3">How it works</div>
          <h2 className="text-[30px] lg:text-[38px] font-extrabold tracking-tight text-white">Referenced in three steps</h2>

/* ---------- CONTACT SALES (Custom / Enterprise inquiry) ---------- */
const cs_input = "w-full px-3.5 h-11 rounded-xl bg-white/[0.05] border border-white/10 text-white placeholder-slate-500 text-[14px] focus:outline-none focus:border-indigo-400/60";
function ContactSales() {
  const [open, setOpen] = useState(false);
  const [status, setStatus] = useState("idle");   // idle | sending | done
  const [form, setForm] = useState({ name: "", email: "", company: "", message: "" });
  useEffect(() => {
    const onOpen = () => { setForm({ name: "", email: "", company: "", message: "" }); setStatus("idle"); setOpen(true); };
    window.addEventListener("refly:contact", onOpen);
    return () => window.removeEventListener("refly:contact", onOpen);
  }, []);
  if (!open) return null;
  const upd = k => e => setForm(f => ({ ...f, [k]: e.target.value }));
  const mailtoFallback = () => {
    const subj = encodeURIComponent("Refly — Custom / Enterprise plan inquiry");
    const body = encodeURIComponent(`Name: ${form.name}\nWork email: ${form.email}\nCompany: ${form.company}\n\n${form.message}`);
    window.location.href = `mailto:support@reflyapp.com?subject=${subj}&body=${body}`;
  };
  const submit = async (e) => {
    e.preventDefault();
    if (!form.email) return;
    setStatus("sending");
    try {
      const r = await fetch("/api/contact-sales", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(form),
      });
      const d = await r.json().catch(() => ({}));
      if (!(r.ok && d.ok && d.delivered)) mailtoFallback();   // backend e-posta yoksa mailto yedeği
    } catch (err) { mailtoFallback(); }
    setStatus("done");
  };
  return (
    <div className="fixed inset-0 z-[100] flex items-center justify-center p-4" style={{ background: "rgba(2,6,23,0.72)", backdropFilter: "blur(4px)" }} onClick={() => setOpen(false)}>
      <motion.div initial={{ opacity: 0, y: 16, scale: 0.98 }} animate={{ opacity: 1, y: 0, scale: 1 }}
        className="glass-strong ring-soft rounded-2xl w-full max-w-md p-6 relative" onClick={e => e.stopPropagation()}>
        <button type="button" onClick={() => setOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white transition" aria-label="Close"><X size={18} /></button>
        {status === "done" ? (
          <div className="text-center py-6">
            <div className="mx-auto w-12 h-12 rounded-full grid place-items-center bg-emerald-400/15 text-emerald-300 mb-3"><Check size={22} strokeWidth={3} /></div>
            <h3 className="text-[19px] font-bold text-white">Thanks — we'll be in touch</h3>
            <p className="mt-2 text-[13.5px] text-slate-400">Our team will reply to <b className="text-slate-200">{form.email || "you"}</b> shortly. You can also reach us at <a className="text-indigo-300 hover:text-indigo-200" href="mailto:support@reflyapp.com">support@reflyapp.com</a>.</p>
            <button type="button" onClick={() => setOpen(false)} className="mt-5 h-10 px-6 rounded-xl text-[14px] font-semibold text-white bg-gradient-to-r from-indigo-500 to-violet-600 cta-glow">Close</button>
          </div>
        ) : (
          <form onSubmit={submit}>
            <h3 className="text-[19px] font-bold text-white">Talk to sales</h3>
            <p className="mt-1 text-[13px] text-slate-400">Tell us about your team and we'll design a custom plan.</p>
            <div className="mt-4 space-y-2.5">
              <input required value={form.name} onChange={upd("name")} placeholder="Your name" className={cs_input} />
              <input required type="email" value={form.email} onChange={upd("email")} placeholder="Work email" className={cs_input} />
              <input value={form.company} onChange={upd("company")} placeholder="Company / institution" className={cs_input} />
              <textarea value={form.message} onChange={upd("message")} rows={3} placeholder="What do you need? (team size, use case…)" className={cs_input.replace("h-11", "py-2.5") + " resize-none"} />
            </div>
            <button type="submit" disabled={status === "sending"} className="mt-4 w-full h-11 rounded-xl text-[14px] font-semibold text-white bg-gradient-to-r from-indigo-500 to-violet-600 cta-glow disabled:opacity-60">
              {status === "sending" ? "Sending…" : "Request custom plan"}
            </button>
            <p className="mt-3 text-center text-[12px] text-slate-500">or email <a className="text-indigo-300 hover:text-indigo-200" href="mailto:support@reflyapp.com">support@reflyapp.com</a></p>
          </form>
        )}
      </motion.div>
    </div>
  );
}
